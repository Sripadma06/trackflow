server:
  port: ${PORT:8080}

spring:
  application:
    name: trackflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trackflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      continue-on-error: true

jwt:
  secret: ${JWT_SECRET:trackflow-super-secret-key-change-this-in-production-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
